name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Inject EmailJS secrets
        env:
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_RECIPIENT: ${{ secrets.EMAILJS_RECIPIENT }}
        run: |
          envsubst '${EMAILJS_PUBLIC_KEY} ${EMAILJS_SERVICE_ID} ${EMAILJS_TEMPLATE_ID} ${EMAILJS_RECIPIENT}' < index.html > index.tmp
          mv index.tmp index.html

      - name: Inject build metadata
        run: |
          BUILD_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")
          BUILD_DATE=$(date -u +"%d/%m/%Y")
          BUILD_COMMIT=$(echo "${{ github.sha }}" | cut -c1-7)
          export BUILD_VERSION BUILD_DATE BUILD_COMMIT
          envsubst '${BUILD_VERSION} ${BUILD_DATE} ${BUILD_COMMIT}' < index.html > index.tmp
          mv index.tmp index.html

      - uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - uses: actions/deploy-pages@v5
